<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sheet connection check</title>
<style>body{font:17px/1.65 system-ui,"Noto Sans Devanagari",sans-serif;max-width:820px;margin:auto;padding:18px;color:#12332c;background:#fbfaf6}h1{color:#0f5c4d}.c{background:#fff;border:1px solid #d7e3da;border-radius:14px;padding:6px 18px 14px;margin:16px 0}.c h2{color:#0f5c4d;font-size:20px}code{background:#e6f4ec;padding:1px 6px;border-radius:4px;word-break:break-all}.ok{color:#0b6b36}.no{color:#c0392b;font-weight:600}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border:1px solid #d7e3da;padding:4px 8px;text-align:left}li{margin:4px 0}</style></head><body>
<h1>Sheet connection check</h1><p>Ye page batata hai ki <code>config.js</code> mein daale Stock aur Blog ke links chal rahe hain ya nahi, aur kya galti hai. Ise browser mein kholo (hosting par ya apne computer par).</p>
<div id="out">जांच हो रही है…</div><p><a href="index.html?debug=1">← Home page (debug ke saath)</a></p>
<script src="config.js"></script><script src="site.js"></script>
<script>
(async()=>{
const li=(ok,t)=>`<p class="${ok?'ok':'no'}">${ok?'✅':'❌'} ${t}</p>`,card=(t,b)=>`<div class="c"><h2>${t}</h2>${b}</div>`,E=esc2;
const FIX='<ul><li><b>Sabse aasan tareeka:</b> Sheet mein <b>Share → General access → Anyone with the link → Viewer</b> karo. Phir us <b>tab</b> ko kholkar address bar ka link (<code>https://docs.google.com/spreadsheets/d/…/edit?gid=…</code>) <code>config.js</code> mein daalo. Stock aur Blog ka link <b>alag-alag tab</b> ka hona chahiye.</li><li>Ya: <b>File → Share → Publish to web</b> mein sahi tab + <b>CSV</b> chuno, link copy karo (ye tareeka file:// se khulne par fail ho sakta hai, hosting par chalta hai).</li><li>Link poora copy hua? <code>config.js</code> save kiya? <b>Ctrl+Shift+R</b> dabao.</li><li>Internet chalu hai?</li></ul>';
async function test(name,url,expect,key,more){
 if(!url)return card(name,li(false,'<code>config.js</code> mein is tab ka link khali hai.')+'<p>Khali hone par '+(key=='blog'?'sample posts':'dummy list')+' dikhti hai.</p>');
 let h=li(true,'config.js mein link mila: <code>'+E(url)+'</code>');
 const rows=await fetchCsv(url,'chk_'+key,true),why=(CSV_DIAG['chk_'+key]||{tried:[]}).tried;
 h+='<p style="font-size:13px;color:#5b6f68">Try kiye gaye tareeke: '+E(why.join(' | '))+'</p>';
 if(!rows)return card(name,h+li(false,'Link se data nahi mila.')+FIX);
 h+=li(true,'Data mil gaya.');const head=(rows[0]||[]).map(x=>x.trim());
 h+='<p>Header (pehli line): <code>'+E(head.join(' | '))+'</code></p>';
 const okh=expect.every((e,i)=>(head[i]||'').toLowerCase()===e.toLowerCase());
 h+=li(okh,okh?'Columns sahi order mein hain.':'Columns ka naam/order alag hai. Hona chahiye: <code>'+expect.join(' | ')+'</code> (pehli line header honi chahiye).');
 return card(name,h+more(rows.slice(1)))}
const stock=r=>{const d=r.filter(x=>x[0]&&x[0].trim());const y=d.filter(x=>/^(yes|y|haan|हाँ|true|1|available|उपलब्ध)$/i.test((x[2]||'').trim())).length,p=d.filter(x=>x[3]&&x[3].trim()).length;
 return li(d.length>0,d.length+' dawaiyan mili: '+y+' Yes, '+(d.length-y)+' No/anya, '+p+' mein price.')+'<table><tr><th>Name</th><th>Available</th><th>Price on site</th></tr>'+d.slice(0,4).map(x=>'<tr><td>'+E(x[0])+'</td><td>'+E(x[2]||'')+'</td><td>'+E(fmtPrice(x[3])||'-')+'</td></tr>').join('')+'</table>'};
const blog=r=>{const d=r.filter(x=>x[2]&&x[2].trim()),now=new Date();let live=0,fut=0,nd=0;d.forEach(x=>{const t=parseDate(x[0]);if(!t)nd++;else if(t>now)fut++;else live++});
 return li(d.length>0,d.length+' posts mili (Title wali lines): '+(live+nd)+' abhi dikhengi, '+fut+' aage ki date ki wajah se baad mein dikhengi.')+(nd?'<p>'+nd+' post ki date samajh nahi aayi (YYYY-MM-DD likhein), wo dikhengi.</p>':'')+'<table><tr><th>Date</th><th>Type</th><th>Title</th></tr>'+d.slice(0,4).map(x=>'<tr><td>'+E(x[0])+'</td><td>'+E(x[1]||'')+' → '+TYPE_LABEL[typeKey(x[1])]+'</td><td>'+E(x[2])+'</td></tr>').join('')+'</table>'};
const same=CONFIG.sheetCsv&&CONFIG.sheetCsv===CONFIG.blogCsv?card('⚠ Dhyan do',li(false,'Stock aur Blog ka link bilkul ek hi hai. Blog tab ka alag link daalo (uska gid alag hota hai).')):'';
document.getElementById('out').innerHTML=same+await test('STOCK tab',CONFIG.sheetCsv,['Name','Use','Available','Price'],'stock',stock)+await test('BLOG tab',CONFIG.blogCsv,['Date','Type','Title','Details','By'],'blog',blog);
})();
</script></body></html>
